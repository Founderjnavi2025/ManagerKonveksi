<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — KONVEKSI HUB</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

<div id="bootScreen" class="boot-screen">
  <div class="boot-logo">KONVEKSI <span>HUB</span></div>
  <div class="boot-spinner"></div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="header-left">
      <div>
        <div class="logo">KONVEKSI <span>HUB</span></div>
        <div class="room-sub" id="roomSub">—</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="clock" id="clock">--:--</div>
      <button class="btn-logout" id="btnLogout">KELUAR</button>
    </div>
  </header>

  <div class="tabs">
    <a href="dashboard.html" class="active">🏠 DASHBOARD</a>
    <a href="jobs.html">📦 PEKERJAAN</a>
    <a href="warehouse.html">👁️ MONITOR</a>
    <a href="payroll.html">💰 PAYROLL</a>
    <a href="reports.html">📊 LAPORAN</a>
  </div>

  <div class="page active">
    <div class="page-header">
      <div class="ph-left">
        <div class="ph-title">Dashboard</div>
        <div class="ph-sub" id="periodeLabel">—</div>
      </div>
    </div>

    <h2 class="section">Ringkasan Periode</h2>
    <div class="stat-grid" id="statGrid">
      <div class="empty">Memuat...</div>
    </div>

    <h2 class="section">Pekerja Aktif</h2>
    <div id="pekerjaAktifList">
      <div class="empty">Memuat...</div>
    </div>

    <h2 class="section">5 Transaksi Terakhir</h2>
    <div id="transaksiList">
      <div class="empty">Memuat...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { requireAuth, getActiveRoomId, doLogout } from '../assets/js/auth.js';
import { Rooms, loadRoomData, hitungUpah, getBebanPerPekerja } from '../assets/js/supabase.js';

const $ = id => document.getElementById(id);

function toast(msg, err){
  const t = $('toast');
  t.textContent = msg;
  t.className = err ? 'show err' : 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 2400);
}

function tick(){
  const d = new Date();
  $('clock').textContent = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2,'0')).join(':');
}

async function init(){
  const session = await requireAuth();
  if(!session) return;

  const roomId = getActiveRoomId();
  if(!roomId){ toast('Pilih room dulu', true); return; }

  const room = await Rooms.get(roomId);
  $('roomSub').textContent = room.nama + ' • ' + (session.profile?.nama || '');
  document.title = room.nama + ' — KONVEKSI HUB';

  const data = await loadRoomData(roomId);
  const { jobs, transactions, periods, workers } = data;

  const periode = periods.find(p => p.status === 'aktif');
  if(periode){
    const fmt = d => {
      const dt = new Date(d+'T00:00:00');
      const b = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      return dt.getDate()+' '+b[dt.getMonth()]+' '+dt.getFullYear();
    };
    $('periodeLabel').textContent = fmt(periode.mulai) + ' — ' + fmt(periode.akhir);
  } else {
    $('periodeLabel').textContent = 'Belum ada periode aktif';
  }

  const aktifWorkers = workers.filter(w => w.aktif);
  const bebanData = await getBebanPerPekerja(roomId);
  const totalBeban = bebanData.reduce((s, w) => s + w.beban, 0);
  const totalPending = bebanData.reduce((s, w) => s + w.pending, 0);

  let totalBayar = 0;
  transactions.forEach(t => { if(t.jenis === 'pembayaran') totalBayar += Number(t.jumlah || 0); });

  $('statGrid').innerHTML = `
    <div class="stat-box"><div class="lbl">Pekerja Aktif</div><div class="val">${aktifWorkers.length}</div></div>
    <div class="stat-box warn"><div class="lbl">Beban (pcs)</div><div class="val warn">${totalBeban}</div></div>
    <div class="stat-box danger"><div class="lbl">Pending (pcs)</div><div class="val danger">${totalPending}</div></div>
    <div class="stat-box ok"><div class="lbl">Sudah Dibayar</div><div class="val ok">Rp${totalBayar.toLocaleString('id-ID')}</div></div>
  `;

  if(bebanData.length === 0){
    $('pekerjaAktifList').innerHTML = '<div class="empty">Belum ada beban kerja</div>';
  } else {
    $('pekerjaAktifList').innerHTML = bebanData.map(w => `
      <div class="card">
        <div class="card-name">${w.worker_nama}</div>
        <div class="card-info">Beban: <b>${w.beban} pcs</b> • Pending: <b>${w.pending} pcs</b> • ${w.jumlah_job} job</div>
      </div>
    `).join('');
  }

  const lastTx = transactions.slice(0, 5);
  if(lastTx.length === 0){
    $('transaksiList').innerHTML = '<div class="empty">Belum ada transaksi</div>';
  } else {
    $('transaksiList').innerHTML = lastTx.map(t => {
      const w = workers.find(x => x.id === t.worker_id);
      return `<div class="card ${t.jenis === 'panjar' ? 'gantung' : 'done'}">
        <div class="card-info">${t.jenis === 'panjar' ? '🟡 Panjar' : '💰 Bayar'} — <b>${w?.nama || '—'}</b> — Rp${Number(t.jumlah).toLocaleString('id-ID')}</div>
      </div>`;
    }).join('');
  }

  $('bootScreen').style.display = 'none';
  $('app').style.display = 'block';
}

$('btnLogout').addEventListener('click', doLogout);
setInterval(tick, 1000);
tick();

init().catch(e => { toast('Error: ' + e.message, true); console.error(e); });
</script>
</body>
</html>
