<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login — KONVEKSI HUB</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div id="bootScreen" class="boot-screen">
  <div class="boot-logo">KONVEKSI <span>HUB</span></div>
  <div class="boot-spinner"></div>
</div>

<div class="page active" id="pageLogin" style="display:none;">
  <div class="auth-box">
    <div class="logo-large">KONVEKSI <span>HUB</span></div>
    <div class="auth-sub">Masuk untuk melanjutkan</div>

    <label class="f">Email</label>
    <input type="email" id="loginEmail" placeholder="nama@email.com" autocomplete="email">

    <label class="f">Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">

    <button class="btn btn-primary btn-block" id="btnLogin" style="margin-top:16px;">MASUK</button>

    <div class="hint" style="text-align:center;margin-top:14px;">
      Akun dibuat oleh Super Admin
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { doLogin, setActiveRoom, getSession } from '../assets/js/auth.js';
import { Rooms } from '../assets/js/supabase.js';

const $ = id => document.getElementById(id);

function toast(msg, err){
  const t = $('toast');
  t.textContent = msg;
  t.className = err ? 'show err' : 'show';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', 2400);
}

async function handleLogin(){
  const email = $('loginEmail').value.trim().toLowerCase();
  const pass = $('loginPassword').value;
  if(!email || !pass){ toast('Isi email dan password', true); return; }

  $('btnLogin').disabled = true;
  $('btnLogin').textContent = 'MEMUAT...';

  try {
    const { user } = await doLogin(email, pass);
    const rooms = await Rooms.listForUser(user.id);
    if(rooms.length > 0){
      setActiveRoom(rooms[0].id, rooms[0].nama);
    }
    toast('✓ Berhasil masuk');
    setTimeout(() => window.location.href = '/pages/dashboard.html', 400);
  } catch(e){
    toast('Login gagal: ' + e.message, true);
    $('btnLogin').disabled = false;
    $('btnLogin').textContent = 'MASUK';
  }
}

$('btnLogin').addEventListener('click', handleLogin);
$('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') handleLogin(); });

(async () => {
  const session = await getSession();
  if(session){
    window.location.href = '/pages/dashboard.html';
    return;
  }
  $('bootScreen').style.display = 'none';
  $('pageLogin').style.display = 'block';
})();
</script>
</body>
</html>
